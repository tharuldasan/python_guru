<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Guru | Zero to Hero</title>
    
    <link rel="icon" href="icon.png" type="image/png">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>

    <style>
        /* --- PROFESSIONAL IDE THEME --- */
        :root {
            --bg-main: #0d1117;
            --bg-panel: #161b22;
            --bg-darker: #010409;
            --border: #30363d;
            --accent: #58a6ff;
            --accent-hover: #1f6feb;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --success: #3fb950;
            --error: #f85149;
            --font-ui: 'Inter', sans-serif;
            --font-code: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: var(--font-ui);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- TOP NAVIGATION BAR --- */
        .top-bar {
            height: 50px;
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }
        .logo { font-weight: 800; font-size: 1.2rem; color: var(--text-main); display: flex; align-items: center; gap: 10px;}
        .logo span { color: var(--accent); }
        
        .btn {
            background: var(--bg-panel);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-family: var(--font-ui);
            font-size: 0.85rem;
            transition: 0.2s;
        }
        .btn:hover { background: var(--border); }
        .btn-primary { background: var(--accent); color: #fff; border: none; }
        .btn-primary:hover { background: var(--accent-hover); }

        /* --- 3-PANE WORKSPACE LAYOUT --- */
        .workspace {
            display: flex;
            height: calc(100vh - 50px);
        }

        /* Pane 1: Curriculum Sidebar */
        .sidebar {
            width: 300px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .sidebar-header {
            padding: 15px; font-weight: 600; border-bottom: 1px solid var(--border);
            color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px;
        }
        .module-group { border-bottom: 1px solid var(--border); }
        .module-title {
            padding: 12px 15px; background: var(--bg-darker); font-weight: 600;
            cursor: pointer; display: flex; justify-content: space-between; font-size: 0.9rem;
        }
        .sublesson {
            padding: 10px 15px 10px 30px; font-size: 0.85rem; color: var(--text-muted);
            cursor: pointer; border-left: 2px solid transparent; transition: 0.2s;
        }
        .sublesson:hover { background: rgba(88, 166, 255, 0.1); color: var(--text-main); }
        .sublesson.active { border-left-color: var(--accent); color: var(--accent); background: rgba(88, 166, 255, 0.05); }

        /* Pane 2: Main Editor Area */
        .main-editor {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-main);
        }
        
        .lesson-brief {
            padding: 20px; border-bottom: 1px solid var(--border); background: var(--bg-panel);
        }
        .lesson-title { font-size: 1.5rem; margin-bottom: 8px; font-weight: 800; }
        .lesson-desc { font-size: 0.95rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 15px;}
        
        .reference-code {
            background: var(--bg-darker); border: 1px solid var(--border);
            padding: 12px; border-radius: 6px; font-family: var(--font-code);
            font-size: 0.85rem; color: #a5d6ff; display: inline-block;
        }

        .editor-wrapper { flex: 1; display: flex; flex-direction: column; position: relative; }
        .editor-toolbar {
            padding: 8px 20px; background: var(--bg-panel); border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }
        
        /* The Clean Input Area */
        #code-editor {
            flex: 1; background: var(--bg-darker); color: var(--text-main);
            font-family: var(--font-code); font-size: 1rem; padding: 20px;
            border: none; outline: none; resize: none; line-height: 1.6;
        }

        .terminal-wrapper {
            height: 200px; background: var(--bg-panel); border-top: 1px solid var(--border);
            display: flex; flex-direction: column;
        }
        .terminal-header {
            padding: 8px 20px; font-size: 0.8rem; font-weight: 600; color: var(--text-muted);
            border-bottom: 1px solid var(--border);
        }
        #terminal-output {
            flex: 1; padding: 15px 20px; font-family: var(--font-code); font-size: 0.9rem;
            color: var(--success); overflow-y: auto; white-space: pre-wrap;
        }
        .error-text { color: var(--error) !important; }

        /* Pane 3: AI Assistant */
        .ai-sidebar {
            width: 350px; background-color: var(--bg-panel); border-left: 1px solid var(--border);
            display: flex; flex-direction: column;
        }
        .ai-header {
            padding: 15px; border-bottom: 1px solid var(--border); font-weight: 600;
            display: flex; align-items: center; gap: 8px; color: #d2a8ff;
        }
        .ai-chat { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        
        .chat-bubble { padding: 12px; border-radius: 8px; font-size: 0.9rem; line-height: 1.5; }
        .ai-message { background: var(--bg-darker); border: 1px solid var(--border); color: var(--text-main); }
        .user-message { background: rgba(88, 166, 255, 0.1); border: 1px solid rgba(88, 166, 255, 0.2); color: #a5d6ff; align-self: flex-end; }
        
        .ai-input-area { padding: 15px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
        #ai-input {
            width: 100%; background: var(--bg-darker); border: 1px solid var(--border);
            color: var(--text-main); padding: 10px; border-radius: 6px; font-family: var(--font-ui);
            resize: none; height: 80px; outline: none;
        }
        #ai-input:focus { border-color: var(--accent); }

    </style>
</head>
<body>

    <audio id="bg-audio" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <div class="top-bar">
        <div class="logo">Python<span>Guru</span></div>
        <div style="display: flex; gap: 10px;">
            <button class="btn" id="btn-audio">▶ Play Audio</button>
            <div id="py-status" style="display: flex; align-items: center; font-size: 0.8rem; color: var(--text-muted);">
                Booting Python Engine...
            </div>
        </div>
    </div>

    <div class="workspace">
        <div class="sidebar">
            <div class="sidebar-header">Zero to Hero Curriculum</div>
            <div id="curriculum-container"></div>
        </div>

        <div class="main-editor">
            <div class="lesson-brief">
                <h1 class="lesson-title" id="lbl-title">Loading...</h1>
                <p class="lesson-desc" id="lbl-desc"></p>
                <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px;">Target Code to Memorize:</div>
                <div class="reference-code" id="lbl-target"></div>
            </div>

            <div class="editor-wrapper">
                <div class="editor-toolbar">
                    <span style="font-size: 0.85rem; color: var(--text-muted); font-family: var(--font-code);">main.py</span>
                    <button class="btn btn-primary" id="btn-run">Run Python Engine</button>
                </div>
                <textarea id="code-editor" spellcheck="false" placeholder="# Write your python code here..."></textarea>
            </div>

            <div class="terminal-wrapper">
                <div class="terminal-header">Console Output</div>
                <div id="terminal-output">Awaiting initialization...</div>
            </div>
        </div>

        <div class="ai-sidebar">
            <div class="ai-header">
                ⚡ Groq AI Support Core
            </div>
            <div class="ai-chat" id="chat-history">
                <div class="chat-bubble ai-message">Hello. I am your integrated Python AI. If you don't understand a lesson or get a syntax error, ask me for help.</div>
            </div>
            <div class="ai-input-area">
                <textarea id="ai-input" placeholder="Ask a question about the code..."></textarea>
                <button class="btn btn-primary" id="btn-ask-ai" style="width: 100%;">Query AI</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. ZERO TO HERO CURRICULUM DATA ---
        const CURRICULUM = [
            {
                module: "Module 1: The Absolute Basics",
                lessons: [
                    { title: "1.1 The Hello World", desc: "The print() function sends text to the screen. It's how Python speaks.", code: "print(\"Hello World\")" },
                    { title: "1.2 Variables", desc: "Variables are containers for storing data values. No command is needed to declare them.", code: "name = \"Guru\"\nprint(name)" },
                    { title: "1.3 Numbers & Math", desc: "Python can act as a calculator. Add numbers directly inside a print statement.", code: "print(50 + 25)" },
                    { title: "1.4 Updating Variables", desc: "You can change the value of a variable after creating it.", code: "score = 10\nscore = score + 5\nprint(score)" }
                ]
            },
            {
                module: "Module 2: Logic & Control Flow",
                lessons: [
                    { title: "2.1 Booleans", desc: "Booleans represent one of two values: True or False.", code: "is_active = True\nprint(is_active)" },
                    { title: "2.2 If Statements", desc: "Use 'if' to run code only when a condition is True. Remember the indentation (spaces)!", code: "age = 18\nif age >= 18:\n    print(\"Access Granted\")" },
                    { title: "2.3 Else Statements", desc: "The 'else' keyword catches anything caught by the preceding conditions.", code: "power = 40\nif power > 50:\n    print(\"Strong\")\nelse:\n    print(\"Weak\")" },
                    { title: "2.4 Elif Chains", desc: "'elif' means 'else if'. Use it to check multiple conditions.", code: "x = 10\nif x > 10:\n    print(\"High\")\nelif x == 10:\n    print(\"Exact\")" }
                ]
            },
            {
                module: "Module 3: Lists & Loops",
                lessons: [
                    { title: "3.1 Creating Lists", desc: "Lists store multiple items in a single variable, wrapped in square brackets.", code: "inventory = [\"Sword\", \"Shield\"]\nprint(inventory)" },
                    { title: "3.2 List Append", desc: "Add an item to the end of a list using the .append() method.", code: "nums = [1, 2]\nnums.append(3)\nprint(nums)" },
                    { title: "3.3 The For Loop", desc: "A for loop iterates over a sequence (like a list).", code: "items = [\"A\", \"B\", \"C\"]\nfor item in items:\n    print(item)" },
                    { title: "3.4 The Range Loop", desc: "Use range() to loop a specific number of times.", code: "for x in range(3):\n    print(\"Looping...\")" }
                ]
            },
            {
                module: "Module 4: Functions (Hero Level)",
                lessons: [
                    { title: "4.1 Defining Functions", desc: "A function is a block of code that only runs when called. Created using 'def'.", code: "def greet():\n    print(\"Hello!\")\n\ngreet()" },
                    { title: "4.2 Function Arguments", desc: "Information can be passed into functions as arguments.", code: "def attack(damage):\n    print(\"Hit for:\", damage)\n\nattack(50)" },
                    { title: "4.3 Return Values", desc: "Let a function return a calculated value back to the program.", code: "def add(a, b):\n    return a + b\n\nresult = add(5, 5)\nprint(result)" }
                ]
            }
        ];

        let activeLesson = null;
        let pyodideInstance = null;

        // --- 2. INITIALIZE SYSTEM ---
        async function bootSystem() {
            renderCurriculum();
            bindEvents();
            loadLesson(0, 0);

            // Boot Real Python Engine via Pyodide
            try {
                pyodideInstance = await loadPyodide();
                document.getElementById("py-status").innerHTML = `<span style="color: var(--success);">● Python Core Online</span>`;
                document.getElementById("terminal-output").innerText = "Python 3 WebAssembly Runtime Ready.\nExecute code when ready.";
            } catch (err) {
                document.getElementById("py-status").innerHTML = `<span style="color: var(--error);">● Python Core Failed</span>`;
                document.getElementById("terminal-output").innerText = "Critical Error: Could not fetch Python engine. Check internet connection.";
            }
        }

        // --- 3. UI RENDERERS ---
        function renderCurriculum() {
            const container = document.getElementById("curriculum-container");
            CURRICULUM.forEach((mod, mIdx) => {
                // Module Header
                let modDiv = document.createElement("div");
                modDiv.className = "module-group";
                modDiv.innerHTML = `<div class="module-title">${mod.module}</div>`;
                
                // Sublessons Container
                let lessonsDiv = document.createElement("div");
                mod.lessons.forEach((les, lIdx) => {
                    let lesDiv = document.createElement("div");
                    lesDiv.className = "sublesson";
                    lesDiv.id = `les-${mIdx}-${lIdx}`;
                    lesDiv.innerText = les.title;
                    lesDiv.onclick = () => loadLesson(mIdx, lIdx);
                    lessonsDiv.appendChild(lesDiv);
                });

                modDiv.appendChild(lessonsDiv);
                container.appendChild(modDiv);
            });
        }

        function loadLesson(mIdx, lIdx) {
            // Update active state in sidebar
            document.querySelectorAll(".sublesson").forEach(el => el.classList.remove("active"));
            const target = document.getElementById(`les-${mIdx}-${lIdx}`);
            if(target) target.classList.add("active");

            // Load data
            activeLesson = CURRICULUM[mIdx].lessons[lIdx];
            document.getElementById("lbl-title").innerText = activeLesson.title;
            document.getElementById("lbl-desc").innerText = activeLesson.desc;
            document.getElementById("lbl-target").innerText = activeLesson.code;
            
            // Clear editor
            document.getElementById("code-editor").value = "";
            if(pyodideInstance) document.getElementById("terminal-output").innerText = "Ready.";
        }

        // --- 4. REAL PYTHON EXECUTION ---
        async function executeCode() {
            const term = document.getElementById("terminal-output");
            const code = document.getElementById("code-editor").value.trim();

            if (!pyodideInstance) {
                term.innerHTML = `<span class="error-text">System Error: Python engine is still booting or failed to load.</span>`;
                return;
            }

            if (code === "") {
                term.innerHTML = `<span class="error-text">Input Empty. Write some Python code first.</span>`;
                return;
            }

            term.innerText = "Running...";
            let outputBuffer = "";

            // Capture Python's print() statements
            pyodideInstance.setStdout({ batched: (msg) => { outputBuffer += msg + "\n"; }});
            pyodideInstance.setStderr({ batched: (msg) => { outputBuffer += msg + "\n"; }});

            try {
                // Run the real Python code!
                await pyodideInstance.runPythonAsync(code);
                
                if (outputBuffer.trim() === "") {
                    term.innerHTML = `<span style="color: var(--text-muted);">Process finished with no output (exit code 0).</span>`;
                } else {
                    term.innerText = outputBuffer;
                }
            } catch (err) {
                // Catch actual Python SyntaxErrors and Tracebacks
                term.innerHTML = `<span class="error-text">${err.toString()}</span>`;
            }
        }

        // --- 5. GROQ AI INTEGRATION ---
        function askAI() {
            const inputEl = document.getElementById("ai-input");
            const question = inputEl.value.trim();
            const code = document.getElementById("code-editor").value;
            const chat = document.getElementById("chat-history");

            if(!question) return;

            // Add user message to UI
            chat.innerHTML += `<div class="chat-bubble user-message">${question}</div>`;
            inputEl.value = "";
            chat.scrollTop = chat.scrollHeight;

            // Loading state
            const loadId = "load-" + Date.now();
            chat.innerHTML += `<div class="chat-bubble ai-message" id="${loadId}">Thinking...</div>`;
            chat.scrollTop = chat.scrollHeight;

            // Call Groq AI
            fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer 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"
                },
                body: JSON.stringify({
                    model: "llama3-8b-8192",
                    messages: [
                        { role: "system", content: "You are an expert Python tutor. Keep answers brief, under 3 sentences. Fix the user's code directly if they ask." },
                        { role: "user", content: `Context Lesson: ${activeLesson.title}\nUser Code:\n${code}\n\nQuestion: ${question}` }
                    ],
                    temperature: 0.3
                })
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById(loadId).innerText = data.choices[0].message.content;
                chat.scrollTop = chat.scrollHeight;
            })
            .catch(err => {
                document.getElementById(loadId).innerHTML = `<span class="error-text">API Connection Error. Verify API key or CORS.</span>`;
            });
        }

        // --- 6. EVENT BINDINGS & FIXES ---
        function bindEvents() {
            // Run Code Button
            document.getElementById("btn-run").addEventListener("click", executeCode);

            // Ask AI Button
            document.getElementById("btn-ask-ai").addEventListener("click", askAI);

            // Handle Tab Key in Editor for proper indentation
            const editor = document.getElementById("code-editor");
            editor.addEventListener("keydown", function(e) {
                if (e.key === "Tab") {
                    e.preventDefault();
                    const start = this.selectionStart;
                    const end = this.selectionEnd;
                    this.value = this.value.substring(0, start) + "    " + this.value.substring(end);
                    this.selectionStart = this.selectionEnd = start + 4;
                }
            });

            // Audio Player Logic
            const audio = document.getElementById("bg-audio");
            const btnAudio = document.getElementById("btn-audio");
            let isPlaying = false;

            btnAudio.addEventListener("click", () => {
                if (!isPlaying) {
                    audio.play();
                    btnAudio.innerText = "⏸ Pause Audio";
                    isPlaying = true;
                } else {
                    audio.pause();
                    btnAudio.innerText = "▶ Play Audio";
                    isPlaying = false;
                }
            });
        }

        // Boot up the entire system when page loads
        window.onload = bootSystem;
    </script>
</body>
</html>
