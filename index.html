<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Python Guru | Cyber-Academy</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
    <style>
        :root {
            --bg-void: #060811;
            --cyan: #00e5ff;
            --gold: #e5c158;
            --glass: rgba(15, 19, 34, 0.7);
        }

        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg-void); font-family: 'Inter', sans-serif; color: white; }

        /* --- PORTAL SCREEN (Animated) --- */
        #portal-screen {
            position: fixed; inset: 0; z-index: 100;
            display: flex; justify-content: center; align-items: center;
            background: radial-gradient(circle, #1a2333 0%, var(--bg-void) 80%);
        }

        /* The Moving 3D Geometry */
        .geometry-container {
            position: absolute; perspective: 1000px;
        }
        .icosahedron {
            width: 200px; height: 200px; transform-style: preserve-3d;
            animation: rotateMatrix 15s infinite linear;
        }
        .icosahedron div {
            position: absolute; width: 200px; height: 200px; border: 2px solid var(--cyan);
            opacity: 0.3; box-shadow: 0 0 20px var(--cyan);
        }
        @keyframes rotateMatrix { from { transform: rotateY(0deg) rotateX(0deg); } to { transform: rotateY(360deg) rotateX(360deg); } }

        /* Background Code Stream */
        .code-stream {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            font-family: 'JetBrains Mono'; font-size: 12px; color: rgba(0, 229, 255, 0.1);
            overflow: hidden; pointer-events: none;
        }
        .stream-col { position: absolute; animation: scrollDown 10s linear infinite; }
        @keyframes scrollDown { from { top: -100%; } to { top: 100%; } }

        /* Portal UI */
        .portal-ui {
            z-index: 10; background: var(--glass); padding: 50px; text-align: center;
            border: 1px solid rgba(0, 229, 255, 0.2); backdrop-filter: blur(10px);
            max-width: 600px;
        }
        h1 { font-family: 'Cinzel', serif; font-size: 3rem; color: var(--gold); text-shadow: 0 0 20px var(--gold); }
        .enter-btn {
            margin-top: 30px; padding: 15px 40px; border: 1px solid var(--cyan);
            background: transparent; color: var(--cyan); cursor: pointer; text-transform: uppercase;
            font-weight: bold; transition: 0.3s;
        }
        .enter-btn:hover { background: var(--cyan); color: var(--bg-void); }

        /* --- WORKSPACE SCREEN (The IDE) --- */
        #workspace-screen { display: none; width: 100vw; height: 100vh; }
        
        /* Reuse previous IDE CSS classes (simplified for brevity) */
        .top-bar { height: 50px; background: #0f1322; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }
        .workspace-grid { display: grid; grid-template-columns: 250px 1fr 300px; height: calc(100vh - 50px); }
        .sidebar { background: #060811; border-right: 1px solid #333; overflow-y: auto; }
        .editor { background: #03050a; color: #a5d6ff; padding: 20px; display: flex; flex-direction: column; }
        textarea { flex: 1; background: transparent; color: white; border: none; font-family: monospace; font-size: 1.1rem; }
        .ai-sidebar { background: #0f1322; border-left: 1px solid #333; padding: 20px; }
        .btn { cursor: pointer; padding: 5px 10px; background: #222; color: white; border: 1px solid #444; }
    </style>
</head>
<body>

    <div id="portal-screen">
        <div class="code-stream" id="code-stream"></div>
        <div class="geometry-container">
            <div class="icosahedron">
                <div></div><div style="transform: rotateY(90deg);"></div>
            </div>
        </div>
        <div class="portal-ui">
            <h1>PYTHON GURU</h1>
            <p>ZERO TO HERO INTERACTIVE ACADEMY</p>
            <button class="enter-btn" onclick="enterAcademy()">Enter Training Ground</button>
        </div>
    </div>

    <div id="workspace-screen">
        <div class="top-bar">
            <div style="font-weight: bold;">Python Guru</div>
            <div>
                <button class="btn" id="audio-toggle">▶ Play Audio</button>
                <span id="status" style="font-size: 0.8rem; margin-left: 10px;">Python Core: Idle</span>
            </div>
        </div>
        <div class="workspace-grid">
            <div class="sidebar" id="sidebar"></div>
            <div class="editor">
                <textarea id="editor" placeholder="Write code here..."></textarea>
                <button class="btn" id="run-btn" style="width: 100%; margin-top: 10px;">Execute</button>
            </div>
            <div class="ai-sidebar" id="ai-chat">
                <div style="color: var(--cyan);">AI Assistant</div>
                <div id="chat-history" style="margin-top: 10px; font-size: 0.9rem;"></div>
                <textarea id="ai-input" style="width: 100%; height: 60px; margin-top: 10px;"></textarea>
                <button class="btn" id="ask-ai">Query AI</button>
            </div>
        </div>
    </div>

    <audio id="bg-audio" loop><source src="music.mp3" type="audio/mpeg"></audio>

    <script>
        // Setup Animated Code Rain
        const stream = document.getElementById('code-stream');
        for(let i=0; i<20; i++){
            const col = document.createElement('div');
            col.className = 'stream-col';
            col.style.left = (i * 5) + '%';
            col.style.animationDelay = (Math.random() * 5) + 's';
            col.innerText = "def x():\n  print('data')\n  return True\n#system";
            stream.appendChild(col);
        }

        // Logic to switch screens
        function enterAcademy() {
            document.getElementById('portal-screen').style.transition = "opacity 1s ease";
            document.getElementById('portal-screen').style.opacity = "0";
            setTimeout(() => {
                document.getElementById('portal-screen').style.display = "none";
                document.getElementById('workspace-screen').style.display = "block";
                bootPyodide();
            }, 1000);
        }

        // Audio Toggle
        const audio = document.getElementById('bg-audio');
        const audioBtn = document.getElementById('audio-toggle');
        audioBtn.onclick = () => {
            if(audio.paused) { audio.play(); audioBtn.innerText = "⏸ Pause Audio"; }
            else { audio.pause(); audioBtn.innerText = "▶ Play Audio"; }
        };

        // Pyodide Init
        async function bootPyodide() {
            let pyodide = await loadPyodide();
            document.getElementById('status').innerText = "Python Core: Online";
            document.getElementById('run-btn').onclick = async () => {
                const code = document.getElementById('editor').value;
                try {
                    let result = await pyodide.runPythonAsync(code);
                    alert("Output: " + result);
                } catch(e) { alert(e); }
            };
        }
    </script>
</body>
</html>
