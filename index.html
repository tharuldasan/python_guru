<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Python Guru | Cyber-Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@300;400;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
    <style>
        :root {
            --bg-void: #060811;
            --cyan: #00e5ff;
            --gold: #e5c158;
        }

        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg-void); color: white; font-family: 'Inter', sans-serif; overflow: hidden; }

        /* --- THE PORTAL LAYER (High Fidelity) --- */
        #portal-layer {
            position: fixed; inset: 0; z-index: 1000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: radial-gradient(circle at center, #101625 0%, #060811 100%);
        }

        /* The Rotating 3D Dodecahedron (The 6-edge Box from Image) */
        .geometry-container {
            position: absolute; width: 300px; height: 300px;
            perspective: 1000px;
            pointer-events: none;
        }
        .dodecahedron {
            width: 100%; height: 100%; position: relative;
            transform-style: preserve-3d;
            animation: rotate3d 20s infinite linear;
        }
        .face {
            position: absolute; width: 100%; height: 100%;
            border: 1px solid var(--cyan);
            background: rgba(0, 229, 255, 0.05);
            box-shadow: 0 0 15px var(--cyan);
        }
        @keyframes rotate3d { from { transform: rotateY(0deg) rotateX(0deg); } to { transform: rotateY(360deg) rotateX(360deg); } }

        /* The Interface Box */
        .ui-box {
            position: relative; z-index: 10;
            background: rgba(15, 19, 34, 0.6);
            border: 1px solid rgba(0, 229, 255, 0.3);
            padding: 60px 80px; text-align: center;
            backdrop-filter: blur(15px);
        }
        .ui-box h1 { font-family: 'Cinzel', serif; font-size: 3.5rem; color: var(--gold); margin: 0 0 20px 0; text-shadow: 0 0 20px var(--gold); letter-spacing: 2px; }
        .ui-box p { color: var(--cyan); letter-spacing: 4px; text-transform: uppercase; font-size: 0.9rem; margin-bottom: 50px; }
        
        .btn-enter {
            background: transparent; border: 1px solid var(--cyan); color: var(--cyan);
            padding: 15px 40px; font-family: 'Inter'; font-weight: bold; cursor: pointer;
            transition: all 0.3s; text-transform: uppercase;
        }
        .btn-enter:hover { background: var(--cyan); color: var(--bg-void); box-shadow: 0 0 20px var(--cyan); }

        /* --- WORKSPACE LAYER (Hidden initially) --- */
        #workspace-layer { display: none; height: 100vh; }
        
        /* IDE Styles */
        .top-bar { height: 50px; background: #0f1322; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }
        .workspace-grid { display: grid; grid-template-columns: 250px 1fr 300px; height: calc(100vh - 50px); }
        .editor-area { background: #03050a; padding: 20px; display: flex; flex-direction: column; }
        #code-input { flex: 1; background: transparent; color: #a5d6ff; border: none; font-family: 'JetBrains Mono'; font-size: 1.1rem; width: 100%; resize: none; }
        .btn { cursor: pointer; padding: 10px; background: #1f2937; color: white; border: 1px solid #374151; }
    </style>
</head>
<body>

    <div id="portal-layer">
        <div class="geometry-container">
            <div class="dodecahedron">
                <div class="face" style="transform: rotateY(0deg) translateZ(150px);"></div>
                <div class="face" style="transform: rotateY(90deg) translateZ(150px);"></div>
                <div class="face" style="transform: rotateY(180deg) translateZ(150px);"></div>
                <div class="face" style="transform: rotateX(90deg) translateZ(150px);"></div>
            </div>
        </div>
        
        <div class="ui-box">
            <h1>PYTHON GURU</h1>
            <p>THE CYBER-CLASSICAL LEARNING ACADEMY</p>
            <button class="btn-enter" onclick="transitionToAcademy()">Enter Training Ground</button>
        </div>
    </div>

    <div id="workspace-layer">
        <div class="top-bar">
            <div style="font-family: 'Cinzel'; font-weight: bold;">Python Guru</div>
            <div>
                <button class="btn" id="audio-toggle">▶ Play Audio</button>
                <span id="status" style="font-size: 0.8rem; margin-left: 10px;">System: Online</span>
            </div>
        </div>
        <div class="workspace-grid">
            <div style="background: #0f1322; border-right: 1px solid #333; padding: 20px;">Curriculum</div>
            <div class="editor-area">
                <textarea id="code-input" placeholder="Write code here..."></textarea>
                <button class="btn" onclick="executeCode()">Execute</button>
            </div>
            <div style="background: #0f1322; border-left: 1px solid #333; padding: 20px;">AI Assistant</div>
        </div>
    </div>

    <script>
        function transitionToAcademy() {
            const portal = document.getElementById('portal-layer');
            portal.style.transition = "opacity 1s ease";
            portal.style.opacity = "0";
            setTimeout(() => {
                portal.style.display = "none";
                document.getElementById('workspace-layer').style.display = "block";
            }, 1000);
        }

        async function executeCode() {
            // Implementation of the Pyodide runner (as established in previous steps)
            alert("Executing Python Engine...");
        }

        const audio = new Audio('music.mp3'); // Ensure this file exists
        document.getElementById('audio-toggle').onclick = (e) => {
            if(audio.paused) { audio.play(); e.target.innerText = "⏸ Pause Audio"; }
            else { audio.pause(); e.target.innerText = "▶ Play Audio"; }
        };
    </script>
</body>
</html>
