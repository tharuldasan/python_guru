<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Guru | Advanced Learning Core</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Fira+Code:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        /* --- HIGH-END COLOR SYSTEM --- */
        :root {
            --bg-void: #030408;
            --glass-panel: rgba(10, 15, 25, 0.75);
            --glass-border: rgba(0, 229, 255, 0.2);
            --gold: #E5C158;
            --gold-dim: rgba(229, 193, 88, 0.4);
            --cyan: #00E5FF;
            --cyan-glow: rgba(0, 229, 255, 0.5);
            --text-light: #F0F4F8;
            --text-dim: #8892B0;
            --font-title: 'Cinzel', serif;
            --font-code: 'Fira Code', monospace;
        }

        /* --- GLOBAL RESETS --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-void);
            color: var(--text-light);
            font-family: var(--font-code);
            overflow: hidden; /* Stop page scrolling, handle it inside components */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* --- DYNAMIC FLOATING MATRIX TEXT --- */
        #particle-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .code-drop {
            position: absolute;
            color: var(--cyan);
            opacity: 0.15;
            font-size: 14px;
            white-space: pre;
            animation: fall linear infinite;
        }
        @keyframes fall {
            from { transform: translateY(-10vh); opacity: 0; }
            10% { opacity: 0.2; }
            90% { opacity: 0.2; }
            to { transform: translateY(110vh); opacity: 0; }
        }

        /* --- AUDIO CONTROLLER --- */
        .audio-hud {
            position: fixed;
            top: 20px; right: 20px;
            z-index: 100;
            display: flex; align-items: center; gap: 10px;
        }
        .hud-btn {
            background: rgba(0,0,0,0.6);
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 8px 16px;
            font-family: var(--font-code);
            font-size: 12px;
            cursor: pointer;
            border-radius: 2px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(229, 193, 88, 0.1);
        }
        .hud-btn:hover {
            background: var(--gold);
            color: var(--bg-void);
            box-shadow: 0 0 15px var(--gold);
        }

        /* --- MAIN GLASSMORPHIC SHELL --- */
        .app-shell {
            position: relative;
            z-index: 10;
            width: 95vw;
            height: 90vh;
            background: var(--glass-panel);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8), inset 0 0 20px rgba(0, 229, 255, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- VIEW TRANSITIONS --- */
        .view {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            padding: 2rem;
            animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .view.active { display: flex; }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- UI ELEMENTS --- */
        .title-gold {
            font-family: var(--font-title);
            color: var(--gold);
            font-size: 3.5rem;
            text-shadow: 0 0 20px var(--gold-dim);
            margin-bottom: 10px;
            text-align: center;
        }
        .subtitle {
            color: var(--text-dim);
            font-size: 1rem;
            letter-spacing: 2px;
            margin-bottom: 40px;
            text-align: center;
        }
        .btn-core {
            background: transparent;
            border: 2px solid var(--cyan);
            color: var(--cyan);
            padding: 15px 40px;
            font-family: var(--font-title);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
        }
        .btn-core:hover {
            background: var(--cyan);
            color: var(--bg-void);
            box-shadow: 0 0 30px var(--cyan-glow);
        }

        /* --- DASHBOARD GRID --- */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 300px 1fr;
            width: 100%;
            height: 100%;
            gap: 20px;
            align-items: start;
            justify-content: start;
        }
        
        /* Left Sidebar (Lessons) */
        .sidebar {
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid var(--glass-border);
            color: var(--gold);
            font-family: var(--font-title);
            text-align: center;
            font-size: 1.2rem;
        }
        .lesson-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .lesson-list::-webkit-scrollbar { width: 6px; }
        .lesson-list::-webkit-scrollbar-thumb { background: var(--cyan); border-radius: 3px; }
        
        .lesson-item {
            padding: 12px;
            background: rgba(255,255,255,0.02);
            border: 1px solid transparent;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
            color: var(--text-dim);
        }
        .lesson-item:hover { background: rgba(0, 229, 255, 0.05); color: var(--cyan); border-color: rgba(0, 229, 255, 0.2); }
        .lesson-item.active { background: rgba(229, 193, 88, 0.1); color: var(--gold); border-left: 3px solid var(--gold); }

        /* Right Workspace */
        .workspace {
            display: flex;
            flex-direction: column;
            height: 100%;
            gap: 15px;
        }
        .info-panel {
            background: rgba(0,0,0,0.4);
            border-left: 3px solid var(--cyan);
            padding: 20px;
            border-radius: 4px;
        }
        .info-title { color: var(--cyan); font-size: 1.4rem; margin-bottom: 5px; }
        
        /* Code Editor */
        .editor-container {
            flex: 1;
            position: relative;
            background: #010204;
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .editor-header {
            background: rgba(255,255,255,0.05);
            padding: 8px 15px;
            font-size: 0.8rem;
            color: var(--text-dim);
            border-bottom: 1px solid var(--glass-border);
            display: flex; justify-content: space-between;
        }
        .editor-area {
            position: relative;
            flex: 1;
        }
        .code-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            padding: 15px; font-size: 1rem; line-height: 1.5; outline: none; border: none;
            resize: none; white-space: pre; overflow: auto; background: transparent;
        }
        .watermark { color: rgba(255,255,255,0.1); z-index: 1; pointer-events: none; }
        .input-layer { color: var(--cyan); z-index: 2; caret-color: var(--gold); }
        
        /* Lower Panel (Terminal & AI) */
        .lower-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            height: 200px;
        }
        .box {
            background: #010204;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            display: flex; flex-direction: column;
        }
        .box-header {
            padding: 8px 12px; font-size: 0.8rem; background: rgba(255,255,255,0.05);
            border-bottom: 1px solid rgba(255,255,255,0.1); color: var(--gold);
            display: flex; justify-content: space-between; align-items: center;
        }
        .term-output {
            padding: 10px; flex: 1; overflow-y: auto; font-size: 0.85rem; color: #a7f3d0;
        }
        .ai-input {
            width: 100%; padding: 10px; background: transparent; border: none;
            border-bottom: 1px solid rgba(255,255,255,0.1); color: white;
            font-family: var(--font-code); font-size: 0.85rem; outline: none;
        }
        .ai-output {
            padding: 10px; flex: 1; overflow-y: auto; font-size: 0.85rem; color: #94a3b8; line-height: 1.4;
        }
    </style>
</head>
<body>

    <audio id="audio-player" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <div class="audio-hud">
        <button id="btn-audio" class="hud-btn">▶ Init Audio</button>
    </div>

    <div id="particle-canvas"></div>

    <div class="app-shell">
        
        <div id="view-landing" class="view active">
            <h1 class="title-gold">Python Guru</h1>
            <p class="subtitle">ADVANCED NEURAL SYNTRACT LEARNING ENVIRONMENT</p>
            <button id="btn-enter" class="btn-core">Access Framework</button>
        </div>

        <div id="view-dashboard" class="view" style="padding: 1.5rem;">
            <div class="dashboard-grid">
                
                <div class="sidebar">
                    <div class="sidebar-header">Core Matrices</div>
                    <div class="lesson-list" id="lesson-list">
                        </div>
                </div>

                <div class="workspace">
                    <div class="info-panel">
                        <h2 id="lesson-title" class="info-title">Loading...</h2>
                        <p id="lesson-desc" style="font-size: 0.95rem; color: var(--text-dim);"></p>
                    </div>

                    <div class="editor-container">
                        <div class="editor-header">
                            <span>workspace.py</span>
                            <button id="btn-run" class="hud-btn" style="padding: 4px 12px; border-color: var(--cyan); color: var(--cyan);">Execute Code</button>
                        </div>
                        <div class="editor-area">
                            <div id="code-watermark" class="code-layer watermark"></div>
                            <textarea id="code-input" class="code-layer input-layer" spellcheck="false"></textarea>
                        </div>
                    </div>

                    <div class="lower-panel">
                        <div class="box">
                            <div class="box-header">Terminal Output</div>
                            <div id="terminal" class="term-output">System ready...</div>
                        </div>
                        
                        <div class="box" style="border-color: var(--gold-dim);">
                            <div class="box-header">Groq AI Support Core 
                                <button id="btn-ai" class="hud-btn" style="padding: 2px 8px;">Ask AI</button>
                            </div>
                            <input type="text" id="ai-query" class="ai-input" placeholder="Type your question here...">
                            <div id="ai-response" class="ai-output">AI Coprocessor online. Standing by for queries.</div>
                        </div>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <script>
        /* --- 1. DATA: 40 BEGINNER LESSONS --- */
        const LESSONS = [
            { id: 1, title: "01: The print() Element", desc: "Output string messages to the display console.", code: "print(\"Hello Python Guru\")" },
            { id: 2, title: "02: Code Note Annotations", desc: "Incorporate inline program comments.", code: "# This is an operational note" },
            { id: 3, title: "03: Variable Binding", desc: "Allocate memory space to reference data strings.", code: "message = \"Data Matrix Loaded\"" },
            { id: 4, title: "04: Numerical Integrations", desc: "Bind simple absolute integer variables.", code: "points = 100" },
            { id: 5, title: "05: Floating Entities", desc: "Map variable symbols to fractional values.", code: "accuracy = 0.98" },
            { id: 6, title: "06: Basic Arithmetical Flows", desc: "Execute computational mathematical addition.", code: "total = 50 + 25" },
            { id: 7, title: "07: Expression Multipliers", desc: "Perform multiplicative operational steps.", code: "area = 10 * 5" },
            { id: 8, title: "08: String Structures", desc: "Define structural alphanumeric strings.", code: "syntax = \"Python Core\"" },
            { id: 9, title: "09: Merging String Assets", desc: "Concatenate multiple separate text arrays.", code: "full = \"Core \" + \"Engine\"" },
            { id: 10, title: "10: Value Conversions", desc: "Cast alphanumeric text instances into integers.", code: "converted = int(\"45\")" },
            { id: 11, title: "11: Dynamic Float Casting", desc: "Transform integers into precise floats.", code: "floating_val = float(10)" },
            { id: 12, title: "12: Text Multiplications", desc: "Replicate string structures iteratively.", code: "glow = \"Glow\" * 3" },
            { id: 13, title: "13: Boolean States", desc: "Assign direct binary logic indicators.", code: "system_active = True" },
            { id: 14, title: "14: Value Equality Probes", desc: "Examine if data variables share matching values.", code: "is_equal = (10 == 10)" },
            { id: 15, title: "15: Inequality Tracking", desc: "Determine value variance deviations.", code: "is_deviant = (5 != 12)" },
            { id: 16, title: "16: Scale Assessments", desc: "Determine mathematical hierarchy size variances.", code: "check = (15 >= 10)" },
            { id: 17, title: "17: Conditional Execution", desc: "Branch system execution behavior via 'if'.", code: "if True:\n    print(\"Passed Check\")" },
            { id: 18, title: "18: Secondary Branching", desc: "Incorporate 'else' logic statements.", code: "if False:\n    pass\nelse:\n    print(\"Fallback\")" },
            { id: 19, title: "19: Multi-Tier Chains", desc: "Chain conditional evaluation routes via 'elif'.", code: "score = 85\nif score > 90:\n    pass\nelif score > 80:\n    print(\"B Tier\")" },
            { id: 20, title: "20: Conjunction Logic", desc: "Combine validation statements using 'and'.", code: "valid = (5 > 2) and (10 > 8)" },
            { id: 21, title: "21: Disjunction Logic", desc: "Process broader validation using 'or'.", code: "status = True or False" },
            { id: 22, title: "22: Logic Inversions", desc: "Reverse binary properties using 'not'.", code: "halt = not True" },
            { id: 23, title: "23: List Initializations", desc: "Construct mutable index data clusters.", code: "nodes = [10, 20, 30]" },
            { id: 24, title: "24: Index Extraction", desc: "Retrieve target elements from a list.", code: "items = [5, 9, 2]\ntarget = items[0]" },
            { id: 25, title: "25: Inverse Indexing", desc: "Target tail-end values inside a list.", code: "items = [4, 8, 12]\ntail = items[-1]" },
            { id: 26, title: "26: Modifying Elements", desc: "Overwite target values inside an array.", code: "grid = [1, 2, 3]\ngrid[1] = 99" },
            { id: 27, title: "27: Array Length Metrics", desc: "Determine total internal counts using len().", code: "sizes = len([4, 8, 12])" },
            { id: 28, title: "28: Appending Data", desc: "Inject new components into a list.", code: "logs = []\nlogs.append(\"init\")" },
            { id: 29, title: "29: Insert Operations", desc: "Incorporate records at specific offsets.", code: "nums = [1, 3]\nums.insert(1, 2)" },
            { id: 30, title: "30: Element Purging", desc: "Remove target records via .remove().", code: "tech = [\"c\", \"py\"]\ntech.remove(\"c\")" },
            { id: 31, title: "31: Iterative For Loops", desc: "Cycle across sequential array tracks.", code: "for i in [1, 2, 3]:\n    print(i)" },
            { id: 32, title: "32: Numeric Generators", desc: "Generate explicit execution iteration indexes.", code: "for x in range(5):\n    print(x)" },
            { id: 33, title: "33: While Loops", desc: "Maintain execution endlessly while true.", code: "runs = 0\nwhile runs < 3:\n    runs += 1" },
            { id: 34, title: "34: Loop Interruptions", desc: "Force prompt terminations using 'break'.", code: "while True:\n    break" },
            { id: 35, title: "35: Function Architecture", desc: "Declare reusable logic blocks via 'def'.", code: "def matrix_sync():\n    print(\"Synced\")" },
            { id: 36, title: "36: Execution Invocation", desc: "Invoke targeted isolated function blocks.", code: "def trigger():\n    pass\ntrigger()" },
            { id: 37, title: "37: Parametric Injections", desc: "Pass raw variables into functions safely.", code: "def signal(type):\n    print(type)\nsignal(\"High\")" },
            { id: 38, title: "38: Return Channels", desc: "Pass evaluation values back to root scopes.", code: "def evaluate():\n    return 42\nresult = evaluate()" },
            { id: 39, title: "39: Dictionary Maps", desc: "Map key-value pairings inside curly braces.", code: "user = {\"id\": 101, \"role\": \"admin\"}" },
            { id: 40, title: "40: Error Exceptions", desc: "Insulate software blocks using try/except.", code: "try:\n    value = 1 / 0\nexcept:\n    print(\"Error Trapped\")"}
        ];

        let activeIndex = 0;

        /* --- 2. INITIALIZATION ON DOM LOAD --- */
        document.addEventListener("DOMContentLoaded", () => {
            initParticleEngine();
            bindEvents();
            buildSidebar();
            loadLesson(0);
        });

        /* --- 3. EVENT BINDINGS (FIXING CLICKS) --- */
        function bindEvents() {
            // View Navigation
            document.getElementById("btn-enter").addEventListener("click", () => {
                document.getElementById("view-landing").classList.remove("active");
                document.getElementById("view-dashboard").classList.add("active");
            });

            // Audio Controls
            const audioEl = document.getElementById("audio-player");
            const btnAudio = document.getElementById("btn-audio");
            let isPlaying = false;
            
            btnAudio.addEventListener("click", () => {
                if (!isPlaying) {
                    audioEl.play().then(() => {
                        btnAudio.innerText = "⏸ Pause Audio";
                        btnAudio.style.borderColor = "var(--cyan)";
                        btnAudio.style.color = "var(--cyan)";
                        isPlaying = true;
                    }).catch(err => {
                        alert("Browser prevented audio playback. Ensure file exists and volume is up.");
                        console.error(err);
                    });
                } else {
                    audioEl.pause();
                    btnAudio.innerText = "▶ Init Audio";
                    btnAudio.style.borderColor = "var(--gold)";
                    btnAudio.style.color = "var(--gold)";
                    isPlaying = false;
                }
            });

            // Editor Sync (Watermark Scrolling & Indentation)
            const inputLayer = document.getElementById("code-input");
            const watermark = document.getElementById("code-watermark");
            
            inputLayer.addEventListener("scroll", () => {
                watermark.scrollTop = inputLayer.scrollTop;
                watermark.scrollLeft = inputLayer.scrollLeft;
            });

            inputLayer.addEventListener("keydown", (e) => {
                if (e.key === "Tab") {
                    e.preventDefault();
                    let start = inputLayer.selectionStart;
                    let end = inputLayer.selectionEnd;
                    inputLayer.value = inputLayer.value.substring(0, start) + "    " + inputLayer.value.substring(end);
                    inputLayer.selectionStart = inputLayer.selectionEnd = start + 4;
                }
                if (e.key === "Enter") {
                    e.preventDefault();
                    let start = inputLayer.selectionStart;
                    let text = inputLayer.value;
                    let lastLine = text.substring(text.lastIndexOf("\n", start - 1) + 1, start);
                    let match = lastLine.match(/^[\s]+/);
                    let space = match ? match[0] : "";
                    inputLayer.value = text.substring(0, start) + "\n" + space + text.substring(start);
                    inputLayer.selectionStart = inputLayer.selectionEnd = start + 1 + space.length;
                }
            });

            // Run Button
            document.getElementById("btn-run").addEventListener("click", runCode);

            // AI Button
            document.getElementById("btn-ai").addEventListener("click", queryGroq);
        }

        /* --- 4. DYNAMIC UI BUILDERS --- */
        function buildSidebar() {
            const list = document.getElementById("lesson-list");
            list.innerHTML = "";
            LESSONS.forEach((l, idx) => {
                let div = document.createElement("div");
                div.className = "lesson-item";
                div.innerText = l.title;
                div.id = "nav-" + idx;
                div.addEventListener("click", () => loadLesson(idx));
                list.appendChild(div);
            });
        }

        function loadLesson(idx) {
            activeIndex = idx;
            document.querySelectorAll(".lesson-item").forEach(el => el.classList.remove("active"));
            document.getElementById("nav-" + idx).classList.add("active");
            
            const l = LESSONS[idx];
            document.getElementById("lesson-title").innerText = l.title;
            document.getElementById("lesson-desc").innerText = l.desc;
            
            document.getElementById("code-watermark").innerText = l.code;
            document.getElementById("code-input").value = "";
            document.getElementById("terminal").innerText = "Ready for execution...";
        }

        /* --- 5. PYTHON TERMINAL SIMULATOR --- */
        function runCode() {
            const input = document.getElementById("code-input").value.trim();
            const target = LESSONS[activeIndex].code.trim();
            const term = document.getElementById("terminal");

            if(input === "") {
                term.innerHTML = "<span style='color: #ef4444;'>Error: Input is empty.</span>";
                return;
            }

            term.innerHTML = "Processing syntax...<br>";

            setTimeout(() => {
                if (input === target) {
                    if (input.includes("print(")) {
                        let msg = input.match(/print\((["'])(.*?)\1\)/);
                        term.innerHTML += `<span style='color: var(--cyan);'>Output: ${msg ? msg[2] : "Success"}</span>`;
                    } else {
                        term.innerHTML += "<span style='color: #10b981;'>Execution Successful. Exit Code 0.</span>";
                    }
                } else {
                    term.innerHTML += "<span style='color: #ef4444;'>SyntaxError: Code does not match target logic matrix exactly.</span>";
                }
            }, 400);
        }

        /* --- 6. GROQ AI INTEGRATION --- */
        function queryGroq() {
            const q = document.getElementById("ai-query").value;
            const code = document.getElementById("code-input").value;
            const out = document.getElementById("ai-response");
            const lesson = LESSONS[activeIndex];

            if (!q.trim()) {
                out.innerText = "Please type a question in the input field.";
                return;
            }

            out.innerHTML = "<span style='color: var(--gold);'>Connecting to Groq Neural Network...</span>";

            fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer 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"
                },
                body: JSON.stringify({
                    model: "llama3-8b-8192",
                    messages: [
                        { role: "system", content: "You are a Python tutor. Keep answers short, direct, and helpful for a beginner." },
                        { role: "user", content: `Lesson: ${lesson.title}\nCode written: ${code}\nQuestion: ${q}` }
                    ],
                    temperature: 0.3
                })
            })
            .then(res => {
                if (!res.ok) throw new Error("API Error");
                return res.json();
            })
            .then(data => {
                out.innerText = data.choices[0].message.content;
            })
            .catch(err => {
                out.innerHTML = "<span style='color: #ef4444;'>Connection failed. Verify API key, internet, or CORS policies.</span>";
            });
        }

        /* --- 7. BACKGROUND PARTICLE ENGINE --- */
        function initParticleEngine() {
            const canvas = document.getElementById("particle-canvas");
            const phrases = ["import sys", "def render():", "yield matrix", "class Guru:", "while True:", "return data"];
            
            setInterval(() => {
                let drop = document.createElement("div");
                drop.className = "code-drop";
                drop.innerText = phrases[Math.floor(Math.random() * phrases.length)];
                drop.style.left = Math.random() * 100 + "vw";
                drop.style.animationDuration = (Math.random() * 5 + 10) + "s"; // 10 to 15 seconds
                canvas.appendChild(drop);

                // Cleanup to prevent DOM overload
                setTimeout(() => { drop.remove(); }, 15000);
            }, 800); // Create a new particle every 0.8 seconds
        }
    </script>
</body>
</html>
